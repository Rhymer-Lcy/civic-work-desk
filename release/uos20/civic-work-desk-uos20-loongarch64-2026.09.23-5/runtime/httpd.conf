# BusyBox httpd configuration — CivicWorkDesk production
#
# Passed with `-c` by the launcher, and only when this file exists, because a BusyBox compiled
# without CONFIG_FEATURE_HTTPD_CONFIG_WITH_MIME_TYPES rejects the option outright and would refuse
# to start.
#
# The MIME table below is no longer a hypothesis. It was measured on the target workstation during
# RC1.1 acceptance: `/` returned text/html, the entry JS text/javascript, the entry CSS text/css,
# /sw.js text/javascript, /manifest.webmanifest application/manifest+json and
# /deployment-health.json application/json. That is the evidence on which BusyBox was selected as
# the production server.
#
# Syntax: `.extension:mime/type`, one per line; `A:`/`D:` allow/deny by address; `I:` index file.

# ---- MIME types CivicWorkDesk actually needs -------------------------------------------------
#
# The two that decide whether the application loads at all:
#   .js   — Chromium refuses a module script served with a non-JavaScript MIME type. The symptom is
#           a blank page with a console error, which reads as an application fault rather than a
#           server misconfiguration, so this line is load-bearing;
#   .json — the manifest link and the deployment-health asset are both fetched as JSON, and the
#           launcher's health gate depends on the latter being served.
.html:text/html
.htm:text/html
.js:text/javascript
.mjs:text/javascript
.css:text/css
.json:application/json
.webmanifest:application/manifest+json
.map:application/json
.svg:image/svg+xml
.png:image/png
.ico:image/x-icon
.woff2:font/woff2
.txt:text/plain

# ---- access ----------------------------------------------------------------------------------
#
# Deny everything, then allow loopback only. Belt-and-braces: `-p 127.0.0.1:8765` already binds the
# socket to the loopback interface, so a host on the LAN cannot reach it at all. Both are stated
# because the two mechanisms fail differently — a mistyped bind argument is caught here.
A:127.0.0.1
D:*

# ---- index -----------------------------------------------------------------------------------
I:index.html

# ---- deliberately absent ---------------------------------------------------------------------
#
# No CGI handler (`*.cgi:` / `*:` lines), no scripting interpreter, no authentication realm, no
# proxy line. The server's only job is to hand out static files from one directory. There is also no
# Cache-Control facility in BusyBox httpd at all, and the update mechanism does not need one: the
# application's assets are content-hashed, so a new release is a new URL, and the browser does not
# serve the top-level service-worker script from the HTTP cache, so a new release is always noticed.
