# BusyBox httpd configuration — CivicWorkDesk RC1 candidate A
#
# Passed with `-c` by start-test.sh, and only if this file exists, because a BusyBox compiled
# without CONFIG_FEATURE_HTTPD_CONFIG_WITH_MIME_TYPES would reject the option and refuse to start.
# Whether the MIME lines below actually take effect on the target is exactly what the acceptance
# test measures — `busybox httpd --help` (from the probe) lists the compiled-in features, and the
# response headers captured with curl are the authoritative answer.
#
# Syntax (BusyBox httpd): `.extension:mime/type`, one per line; `A:`/`D:` allow/deny by address;
# `I:` index file.

# ---- MIME types CivicWorkDesk actually needs -------------------------------------------------
#
# The two that matter most:
#   .js   — Chromium refuses a module script served with a non-JavaScript MIME type, which would
#           show as a blank page with a console error rather than as a server failure;
#   .json — the manifest link and the deployment health asset are both fetched as JSON.
#
# BusyBox's built-in table is small and varies by build; declaring them here removes the question.
.html:text/html
.htm:text/html
.js:text/javascript
.mjs:text/javascript
.css:text/css
.json:application/json
.webmanifest:application/manifest+json
.map:application/json
.svg:image/svg+xml
.png:image/png
.ico:image/x-icon
.woff2:font/woff2
.txt:text/plain

# ---- access ----------------------------------------------------------------------------------
#
# Deny everything, then allow loopback only. This is belt-and-braces: `-p 127.0.0.1:8765` already
# binds the socket to the loopback interface, so a LAN client cannot reach it at all. Both are
# stated because the two mechanisms fail differently — a mistyped `-p` would be caught here.
A:127.0.0.1
D:*

# ---- index -----------------------------------------------------------------------------------
I:index.html
